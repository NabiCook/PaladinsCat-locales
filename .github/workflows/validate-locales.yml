name: Validate localization tooling and locale packs

on:
  pull_request:
    paths:
      - "locales/**"
      - "game-client/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tolgee.config.cjs"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "locales/**"
      - "game-client/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tolgee.config.cjs"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
